<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractions · Axognition</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3ff;font:18px system-ui}main{max-width:1000px;margin:auto;padding:22px}header,nav,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:28px}button,select{font:inherit;padding:12px 18px;border-radius:14px;border:1px solid #536078;background:#25324a;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#7159ed}section{background:#1c2940;border-radius:24px;padding:24px;margin:16px 0}#visual{height:190px;width:100%}#caption{line-height:1.7;min-height:125px}progress{width:100%;accent-color:#aa9bff}label{display:flex;gap:12px;align-items:center}input{flex:1;min-width:90px}#choices{display:grid;gap:10px}#choices button{text-align:left}#feedback{line-height:1.6;color:#bfead6}small{color:#b7c5df}svg rect,svg circle{transition:all .6s}button:focus-visible{outline:3px solid #ffc961}@media(max-height:550px){#visual{height:110px}section{padding:12px}#caption{min-height:0}}
</style></head><body><main>
<header><div><small>AXOGNITION / MATHEMATICS</small><h1 id="title">Loading fractions…</h1></div><span>30-minute guided unit</span></header>
<div class="row"><select id="chapters" aria-label="Choose chapter"></select><span id="clock"></span></div><progress id="progress" max="1800" value="0" aria-label="Lesson progress"></progress>
<section><h2 id="heading"></h2><svg id="visual" viewBox="0 0 800 180" role="img"></svg><label id="explore">Explore equal shares <input id="parts" type="range" min="2" max="12" value="6"></label><p id="caption" aria-live="polite"></p><small id="hint"></small></section>
<nav><button id="play" class="primary">Start lesson</button><button id="replay">Replay narration</button><button id="mute">Voice on</button><button id="back">Previous</button><button id="next">Next chapter</button><button id="reset">Restart unit</button></nav>
<section id="quiz" hidden><h2 id="question"></h2><div id="choices"></div><p id="feedback" role="status"></p></section>
<p id="status" role="status"></p><small>Progress is saved on this device. Captions include all spoken explanations. Checkpoints pause the lesson until you answer correctly.</small>
</main><script>
'use strict';
let lesson, index=0, elapsed=0, playing=false, muted=false, scene=-1, answers={}, ttsBusy=false;
const $=id=>document.getElementById(id), key='axognition-fractions-v1';
function save(){try{localStorage.setItem(key,JSON.stringify({index,elapsed,answers}));}catch(e){}}
function stopVoice(){if(window.LessonVoice) LessonVoice.stop(); else if(window.speechSynthesis) speechSynthesis.cancel();}
function speak(text){stopVoice();if(muted)return;if(window.LessonVoice){LessonVoice.speak(text);return;}if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}else $('status').textContent='Voice unavailable on this browser. All narration is available as captions.';}
function draw(){
 const c=lesson.chapters[index], d=index===2?Number($('parts').value):c.denominator,n=index===2?1:c.numerator;
 const count=Math.min(n,1+Math.floor(elapsed/2));
 let out='';
 if(c.visual==='line'){
 out='<line x1="60" y1="90" x2="740" y2="90" stroke="white" stroke-width="3"/>';
 for(let j=0;j<=d;j++)out+='<text x="'+(60+j*680/d)+'" y="140" fill="white" text-anchor="middle">'+j+'/'+d+'</text><line x1="'+(60+j*680/d)+'" y1="80" x2="'+(60+j*680/d)+'" y2="100" stroke="white"/>';
 out+='<circle cx="'+(60+680/d*count)+'" cy="90" r="12" fill="#ffc961"/>';
 }else if(c.visual==='collection'){
 for(let j=0;j<8;j++)out+='<circle cx="'+(100+(j%4)*180)+'" cy="'+(50+Math.floor(j/4)*75)+'" r="24" fill="'+(j%4<3?'#a899ff':'#42516c')+'"/>';
 }else{
 function strip(den,num,y){let s='';for(let j=0;j<den;j++)s+='<rect x="'+(40+j*720/den)+'" y="'+y+'" width="'+(720/den-4)+'" height="48" rx="6" fill="'+(j<num?'#a899ff':'#42516c')+'"/>';return s;}
 out=strip(d,count,35);if(c.visual==='equivalent')out+=strip(2,1,100);
 else out+='<text x="400" y="140" fill="white" font-size="28" text-anchor="middle">'+n+'/'+d+'</text>';
 }
 $('visual').innerHTML=out;$('visual').setAttribute('aria-label',c.title+': '+n+' of '+d+' equal parts');
}
function render(){
 const c=lesson.chapters[index];$('title').textContent=lesson.title;$('heading').textContent=(index+1)+'. '+c.title;
 $('chapters').value=index;$('explore').hidden=index!==2;
 let s=Math.min(2,Math.floor(elapsed/45));if(scene!==s){scene=s;$('caption').textContent=c.scenes[s];if(playing)speak(c.scenes[s]);}
 $('hint').textContent=elapsed<135?'Watch, listen and explore. A checkpoint opens at 2:15.':'Checkpoint time · explain your reasoning';
 $('clock').textContent=Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0')+' / 3:00';
 $('progress').value=index*180+elapsed;$('back').disabled=index===0;$('next').disabled=!answers[index];
 $('play').textContent=playing?'Pause':'Play';draw();
 $('quiz').hidden=elapsed<135;
 if(elapsed>=135){$('question').textContent=c.question;if(!$('choices').children.length){c.options.forEach((text,i)=>{const b=document.createElement('button');b.textContent=text;b.onclick=()=>{const correct=i===c.answer;$('feedback').textContent=correct?'Correct. '+c.feedback:'Try again. '+c.feedback;speak($('feedback').textContent);if(correct){answers[index]=true;$('next').disabled=false;save();}};$('choices').append(b);});}}
}
function go(i){stopVoice();index=i;elapsed=0;scene=-1;playing=false;$('choices').replaceChildren();$('feedback').textContent='';save();render();}
$('play').onclick=()=>{if(!lesson)return;playing=!playing;if(playing)speak(lesson.chapters[index].scenes[Math.min(2,Math.floor(elapsed/45))]);else stopVoice();render();};
$('replay').onclick=()=>{if(lesson)speak(lesson.chapters[index].scenes[Math.min(2,Math.floor(elapsed/45))]);};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Voice off':'Voice on';stopVoice();};
$('back').onclick=()=>go(index-1);
$('next').onclick=()=>{if(index<9)go(index+1);else{playing=false;stopVoice();const done=Object.values(answers).filter(Boolean).length;$('status').textContent=done===10?'Unit complete! You answered all ten checkpoints. Revisit any chapter using the chapter menu.':'You have completed '+done+' of 10 checkpoints. Use the chapter menu to finish the remaining chapters.';render();}};
$('chapters').onchange=()=>go(Number($('chapters').value));
$('reset').onclick=()=>{if(confirm('Restart the unit and clear progress on this device?')){answers={};go(0);}};
$('parts').oninput=draw;
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;stopVoice();save();if(lesson)render();}});
setInterval(()=>{if(!playing||!lesson)return;if(elapsed===135&&!answers[index]){playing=false;stopVoice();speak(lesson.chapters[index].question);render();return;}if(elapsed>=180){playing=false;if(answers[index]&&index<9){go(index+1);playing=true;scene=-1;}else if(index===9)$('status').textContent='Practice complete. Answer the last checkpoint and select Next chapter to finish.';}else elapsed++;save();render();},1000);
fetch('./fractions.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(data=>{
 lesson=data;try{const p=JSON.parse(localStorage.getItem(key));if(p){index=Math.max(0,Math.min(9,Number(p.index)||0));elapsed=Math.max(0,Math.min(180,Number(p.elapsed)||0));answers=p.answers||{};}}catch(e){}
 lesson.chapters.forEach((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+c.title;$('chapters').append(o);});render();
}).catch(e=>{$('title').textContent='Lesson could not load';$('status').textContent='Check the server connection and reload. '+e.message;});
</script></body></html>
